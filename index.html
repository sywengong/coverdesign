<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>封面设计师 - 短视频封面生成工具</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header class="toolbar">
            <div class="toolbar-left">
                <h1>封面设计师</h1>
            </div>
            <div class="toolbar-right">
                <button class="btn btn-primary" id="templateBtn" title="使用模板">
                    <span><i class="fas fa-magic"></i></span>
                    <span>模板</span>
                </button>
                <button class="btn btn-primary" id="exportBtn">
                        <span><i class="fas fa-download"></i></span>
                        <span>导出图片</span>
                    </button>
                <button class="btn btn-secondary" id="saveBtn">
                        <span><i class="fas fa-save"></i></span>
                        <span>保存项目</span>
                    </button>
                <button class="btn btn-secondary" id="exportProjectBtn">
                        <span><i class="fas fa-file-export"></i></span>
                        <span>导出项目</span>
                    </button>
                <button class="btn btn-secondary" id="loadBtn">
                        <span><i class="fas fa-folder-open"></i></span>
                        <span>加载项目</span>
                    </button>
                <button class="btn btn-danger" id="clearBtn">
                        <span><i class="fas fa-trash"></i></span>
                        <span>清空</span>
                    </button>
            </div>
        </header>

        <div class="main-content">
            <aside class="left-panel">
                <div class="panel-section">
                    <h3>画布尺寸</h3>
                    <div class="canvas-sizes">
                         <button class="size-btn active" data-width="1080" data-height="1920" data-platform="generic">
                            <span class="platform-icon"><i class="fas fa-play"></i></span>
                            <span class="platform-name">通用</span>
                            <span class="size-info">1080×1920</span>
                        </button>
                        <button class="size-btn" data-width="1080" data-height="1920" data-platform="douyin">
                            <span class="platform-icon"><i class="fas fa-mobile-screen"></i></span>
                            <span class="platform-name">抖音</span>
                            <span class="size-info">1080×1920</span>
                        </button>
                        <button class="size-btn" data-width="1242" data-height="1660" data-platform="xiaohongshu">
                            <span class="platform-icon"><i class="fas fa-book"></i></span>
                            <span class="platform-name">小红书</span>
                            <span class="size-info">1242×1660</span>
                        </button>
                        <button class="size-btn" data-width="1080" data-height="1260" data-platform="wechat">
                            <span class="platform-icon"><i class="fas fa-comment"></i></span>
                            <span class="platform-name">微信</span>
                            <span class="size-info">1080×1260</span>
                        </button>
                        <button class="size-btn" data-width="1080" data-height="1080" data-platform="instagram">
                            <span class="platform-icon"><i class="fas fa-camera"></i></span>
                            <span class="platform-name">Instagram</span>
                            <span class="size-info">1080×1080</span>
                        </button>
                        <button class="size-btn" data-width="1920" data-height="1080" data-platform="hengfu">
                            <span class="platform-icon"><i class="fas fa-play"></i></span>
                            <span class="platform-name">横幅</span>
                            <span class="size-info">1920×1080</span>
                        </button>
                    </div>
                    <div class="zoom-controls" style="margin-top: 15px;">
                        <button class="btn btn-small btn-secondary" id="zoomOutBtn" title="缩小"><i class="fas fa-minus"></i></button>
                        <span id="zoomLevel">100%</span>
                        <button class="btn btn-small btn-secondary" id="zoomInBtn" title="放大"><i class="fas fa-plus"></i></button>
                        <button class="btn btn-small btn-secondary" id="zoomFitBtn" title="适应屏幕"><i class="fas fa-expand"></i></button>
                    </div>
                    <div class="setting-row">
                        <label class="checkbox-label">
                            <input type="checkbox" id="showGuides" checked>
                            显示辅助线
                        </label>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>添加元素</h3>
                    <div class="element-tools">
                        <button class="tool-btn" id="addTextBtn">
                            <span class="icon"><i class="fas fa-font"></i></span>
                            <span>文字</span>
                        </button>
                        <button class="tool-btn" id="addImageBtn">
                            <span class="icon"><i class="fas fa-image"></i></span>
                            <span>图片</span>
                        </button>
                        <button class="tool-btn" id="addRectBtn">
                            <span class="icon"><i class="fas fa-square"></i></span>
                            <span>矩形</span>
                        </button>
                        <button class="tool-btn" id="addCircleBtn">
                            <span class="icon"><i class="fas fa-circle"></i></span>
                            <span>圆形</span>
                        </button>
                        <button class="tool-btn" id="addTriangleBtn">
                            <span class="icon"><i class="fas fa-caret-up"></i></span>
                            <span>三角形</span>
                        </button>
                        <button class="tool-btn" id="addStarBtn">
                            <span class="icon"><i class="fas fa-star"></i></span>
                            <span>星形</span>
                        </button>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>贴纸</h3>
                    <div class="sticker-list" id="stickerList">
                    </div>
                </div>

                <div class="panel-section background-settings">
                    <h3>背景设置</h3>
                    <div class="setting-row">
                        <label>背景颜色</label>
                        <input type="color" id="bgColor" value="#ffffff">
                    </div>
                    <div class="setting-row">
                        <label class="checkbox-label">
                            <input type="checkbox" id="useGradient">
                            使用渐变背景
                        </label>
                    </div>
                    <div class="gradient-settings">
                        <div class="setting-row">
                            <label>起始颜色</label>
                            <input type="color" id="gradientStart" value="#667eea">
                        </div>
                        <div class="setting-row">
                            <label>结束颜色</label>
                            <input type="color" id="gradientEnd" value="#764ba2">
                        </div>
                        <div class="setting-row">
                            <label>渐变方向</label>
                            <select id="gradientDirection">
                                <option value="to-bottom">从上到下</option>
                                <option value="to-right">从左到右</option>
                                <option value="to-br">从左上到右下</option>
                                <option value="to-bl">从右上到左下</option>
                            </select>
                        </div>
                    </div>
                    <div class="setting-row">
                        <label>背景图片</label>
                        <input type="file" id="bgImageInput" accept="image/*">
                    </div>
                </div>
            </aside>

            <main class="canvas-area">
                <div class="canvas-wrapper" id="canvasWrapper">
                    <canvas class="canvas" id="canvas"></canvas>
                </div>
            </main>

            <aside class="right-panel">
                <div class="panel-section" id="layerPanel">
                    <h3>图层管理</h3>
                    <div class="layer-list" id="layerList">
                    </div>
                    <div class="layer-buttons" style="margin-top: 10px;">
                        <button class="btn btn-small btn-secondary" id="layerUp" title="上移一层">↑</button>
                        <button class="btn btn-small btn-secondary" id="layerDown" title="下移一层">↓</button>
                        <button class="btn btn-small btn-secondary" id="layerTop" title="置于顶层">⤒</button>
                        <button class="btn btn-small btn-secondary" id="layerBottom" title="置于底层">⤓</button>
                    </div>
                </div>

                <div class="panel-section" id="alignPanel">
                    <h3>对齐</h3>
                    <div class="align-buttons">
                        <button class="btn btn-small btn-secondary" id="alignLeft" title="左对齐"><i class="fas fa-align-left"></i></button>
                        <button class="btn btn-small btn-secondary" id="alignCenter" title="水平居中"><i class="fas fa-align-center"></i></button>
                        <button class="btn btn-small btn-secondary" id="alignRight" title="右对齐"><i class="fas fa-align-right"></i></button>
                    </div>
                    <div class="align-buttons" style="margin-top: 8px;">
                        <button class="btn btn-small btn-secondary" id="alignTop" title="顶部对齐"><i class="fas  fa-arrow-up-wide-short"></i></button>
                        <button class="btn btn-small btn-secondary" id="alignMiddle" title="垂直居中"><i class="fas fa-align-justify"></i></button>
                        <button class="btn btn-small btn-secondary" id="alignBottom" title="底部对齐"><i class="fas fa-arrow-down-short-wide"></i></button>
                    </div>
                </div>

                <div class="panel-section" id="elementSettings">
                    <h3>元素属性</h3>
                    <div class="setting-row">
                        <label>不透明度</label>
                        <input type="range" id="elementOpacity" min="0" max="100" value="100">
                        <span id="opacityValue">100%</span>
                    </div>
                    <div class="setting-row">
                        <label>X坐标</label>
                        <input type="number" id="elementX" value="0">
                    </div>
                    <div class="setting-row">
                        <label>Y坐标</label>
                        <input type="number" id="elementY" value="0">
                    </div>
                    <div class="setting-row">
                        <label>宽度</label>
                        <input type="number" id="elementWidth" value="100">
                    </div>
                    <div class="setting-row">
                        <label>高度</label>
                        <input type="number" id="elementHeight" value="100">
                    </div>
                    <div class="setting-row">
                        <label>颜色</label>
                        <input type="color" id="textColor" value="#000000">
                    </div>
                </div>

                <div class="panel-section" id="textSettings" style="display: none;">
                    <h3>文字属性</h3>
                    <div class="setting-row">
                        <label>字体</label>
                        <select id="fontFamily">
                            <option value="Microsoft YaHei">微软雅黑</option>
                            <option value="SimHei">黑体</option>
                            <option value="SimSun">宋体</option>
                            <option value="KaiTi">楷体</option>
                            <option value="Arial">Arial</option>
                            <option value="Times New Roman">Times New Roman</option>
                            <option value="Georgia">Georgia</option>
                            <option value="Verdana">Verdana</option>
                            <option value="Courier New">Courier New</option>
                        </select>
                        <button class="btn btn-small btn-secondary" id="detectFontsBtn" title="检测系统字体"><i class="fas fa-magnifying-glass"></i></button>
                    </div>
                    <div class="setting-row">
                        <label>字体大小</label>
                        <input type="number" id="fontSize" value="48" min="8" max="200">
                    </div>
                    <div class="setting-row">
                        <label>字体粗细</label>
                        <select id="fontWeight">
                            <option value="normal">正常</option>
                            <option value="bold">粗体</option>
                            <option value="lighter">细体</option>
                        </select>
                    </div>
                    <div class="setting-row">
                        <label>对齐方式</label>
                        <select id="textAlign">
                            <option value="left">左对齐</option>
                            <option value="center">居中</option>
                            <option value="right">右对齐</option>
                        </select>
                    </div>
                </div>

                <div class="panel-section" id="shapeSettings" style="display: none;">
                    <h3>形状属性</h3>
                    <div class="setting-row">
                        <label>填充颜色</label>
                        <input type="color" id="shapeFill" value="#ff6b6b">
                    </div>
                    <div class="setting-row">
                        <label>边框颜色</label>
                        <input type="color" id="shapeStroke" value="#000000">
                    </div>
                    <div class="setting-row">
                        <label>边框宽度</label>
                        <input type="number" id="shapeStrokeWidth" value="0" min="0" max="50">
                    </div>
                    <div class="setting-row">
                        <label>圆角半径</label>
                        <input type="number" id="shapeBorderRadius" value="0" min="0" max="500">
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="js/utils.js"></script>
    <script src="js/layer.js"></script>
    <script src="js/elements.js"></script>
    <script src="js/canvas.js"></script>
    <script src="js/templates.js"></script>
    <script src="js/template-selector.js"></script>
    <script src="js/main.js"></script>
        <div id="contextMenu" class="context-menu">
            <div class="context-menu-item" data-action="layerUp">上移一层</div>
            <div class="context-menu-item" data-action="layerDown">下移一层</div>
            <div class="context-menu-item" data-action="layerTop">置于顶层</div>
            <div class="context-menu-item" data-action="layerBottom">置于底层</div>
            <div class="context-menu-divider"></div>
            <div class="context-menu-item" data-action="copy">复制</div>
            <div class="context-menu-item" data-action="delete">删除</div>
        </div>
    </body>
</html>
